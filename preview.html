</style></head><body><div id="app"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/1.0.0/chess.min.js"></script><script>const jolyne='./src/assets/trainers/jolyne.svg';

const trainers = [
  {id:'jonathan',name:'Джонатан Джостар',en:'Jonathan Joestar',img:jonathan,line:'Спокойствие, дисциплина и точный расчёт.'},
  {id:'joseph',name:'Джозеф Джостар',en:'Joseph Joestar',img:joseph,line:'Планируй на два шага вперёд. И удивляй соперника.'},
  {id:'jotaro',name:'Джотаро Куджо',en:'Jotaro Kujo',img:jotaro,line:'Не трать время. Ищи сильнейший ход.'},
  {id:'josuke',name:'Джоске Хигашиката',en:'Josuke Higashikata',img:josuke,line:'Сначала сохрани свои фигуры.'},
  {id:'giorno',name:'Джорно Джованна',en:'Giorno Giovanna',img:giorno,line:'Даже из сложной позиции есть выход.'},
  {id:'jolyne',name:'Джолин Куджо',en:'Jolyne Cujoh',img:jolyne,line:'Терпение и смелость меняют партию.'}
];
const stands = [
  {id:'kc',name:'KING CRIMSON',say:'King Crimson',desc:'Предвидение: после активации ты получаешь дополнительный ход.',power:'extra',color:'#d56b91'},
  {id:'world',name:'THE WORLD',say:'Za Warudo',desc:'Остановка времени: бот ждёт 7 секунд перед следующим ходом.',power:'freeze',color:'#e9bd67'},
  {id:'star',name:'STAR PLATINUM',say:'Star Platinum',desc:'Точный расчёт: подсвечивает доступные ходы и подсказывает один вариант.',power:'hint',color:'#9b7bff'},
  {id:'crazy',name:'CRAZY DIAMOND',say:'Crazy Diamond',desc:'Восстановление: отменяет последний ход бота.',power:'undo',color:'#68c7dc'},
  {id:'killer',name:'KILLER QUEEN',say:'Killer Queen',desc:'Тактический импульс: выделяет все фигуры соперника, которые можно взять.',power:'targets',color:'#d9a7e8'},
  {id:'gold',name:'GOLD EXPERIENCE',say:'Gold Experience',desc:'Жизненная энергия: один раз отменяет последний собственный ход.',power:'undo',color:'#a5c86b'},
  {id:'requiem',name:'GOLD EXPERIENCE REQUIEM',say:'Gold Experience Requiem',desc:'Возвращение к нулю: отменяет последний ход бота.',power:'undo',color:'#f0d17e'},
  {id:'made',name:'MADE IN HEAVEN',say:'Made in Heaven',desc:'Ускорение: бот делает следующий ход быстрее.',power:'fast',color:'#b3c8ff'},
  {id:'weather',name:'WEATHER REPORT',say:'Weather Report',desc:'Прогноз: показывает один легальный ход бота как предупреждение.',power:'hint',color:'#81c8d9'},
  {id:'tusk',name:'TUSK ACT 4',say:'Tusk Act Four',desc:'Неудержимый темп: подсвечивает возможные взятия.',power:'targets',color:'#dfb46e'}
];
const glyph={wk:'♔',wq:'♕',wr:'♖',wb:'♗',wn:'♘',wp:'♙',bk:'♚',bq:'♛',br:'♜',bb:'♝',bn:'♞',bp:'♟'};
const $=id=>document.getElementById(id);
let game=new Chess(),selected=null,legal=[],lastMove=null,trainer=2,matchCount=0,arrows=0,awakened={},used={},history=[],busy=false,gameEnded=false,voiceOn=true,freezeNext=false,extraMove=false,fastNext=false;
const app=$('app');
app.innerHTML=`<div class="app">
<header class="header"><div class="brand"><div class="brandmark">✦</div><div><h1>STAND CHESS</h1><p>NEBULA PROJECT · JOJO EDITION</p></div></div><div class="head-right"><span class="version">VERSION 1.2</span><button class="icon-btn" id="soundToggle" aria-label="Озвучка">🔊 Звук</button></div></header>
<div class="layout"><section class="game-panel">
<div class="opponent"><div class="avatar-mini"><img src="${jotaro}" alt="Бот"/></div><div><div class="player-name">NEBULA BOT</div><div class="player-sub">Соперник · уровень новичок</div></div><div class="clock" id="botClock">∞</div></div>
<div class="board-wrap"><div class="board" id="board" role="grid" aria-label="Шахматная доска"></div></div>
<div class="opponent" style="padding:13px 3px 0"><div class="avatar-mini"><img id="youAvatar" src="${jotaro}" alt="Тренер"/></div><div><div class="player-name">ТЫ · БЕЛЫЕ</div><div class="player-sub" id="youCoach">Тренер: Джотаро Куджо</div></div><div class="clock active" id="youClock">∞</div></div>
<div class="move-status" id="status">Твой ход. Выбери фигуру и клетку назначения.</div>
<div class="board-actions"><button class="primary" id="newGame">Новая партия</button><button class="secondary" id="undo">Отменить ход</button><button class="secondary" id="flip">Перевернуть доску</button></div>
</section><aside class="side-col">
<section class="side-panel coach-panel"><h2 class="side-title">ВЫБЕРИ ТРЕНЕРА</h2><div class="coach-current"><img id="coachBig" src="${jotaro}" alt="Портрет тренера"/><div><strong id="coachName">Джотаро Куджо</strong><p id="coachLine">Не трать время. Ищи сильнейший ход.</p></div></div><div class="coach-grid" id="coachGrid"></div></section>
<section class="side-panel"><h2 class="side-title">ПРОБУЖДЕНИЕ СТЕНДА</h2><div class="stat-row"><span>Завершено партий</span><strong id="games">0 / 10</strong></div><div class="stat-row"><span>Стрелы в запасе</span><strong id="arrows">0</strong></div><p class="muted">За каждые 10 завершённых партий выдаётся стрела. Выбери свою фигуру на доске и используй её.</p><button class="primary" id="useArrow" style="width:100%;margin-top:9px" disabled>Использовать стрелу</button><div class="stand-box"><div class="stand-name" id="standName">СТЕНД НЕ ПРОБУЖДЁН</div><p class="muted" id="standDesc">Выбери фигуру, чтобы увидеть её стенд и способность.</p></div><div class="stand-actions"><button class="secondary" id="activate" disabled>Активировать</button><button class="secondary" id="voiceTest">Проверить голос</button></div></section>
<section class="side-panel"><h2 class="side-title">ХРОНИКА ПАРТИИ</h2><div class="log" id="log">Партия началась. Удачи!</div></section>
<section class="side-panel"><h2 class="side-title">ПАРАМЕТРЫ</h2><label class="muted" for="difficulty">Сложность бота</label><select class="select" id="difficulty"><option value="easy">Новичок</option><option value="medium">Любитель</option><option value="hard">Сильный (материальная оценка)</option></select><p class="muted" style="margin-bottom:0">Голос использует системный синтез речи Android. Интернет для озвучки не требуется, если на устройстве установлен голосовой движок.</p></section>
</aside></div><p class="footnote">Fan-made chess prototype · Неофициальный проект · Голоса актёров и аудио из аниме не используются</p></div>
<div class="modal" id="modal"><div class="modal-card"><h2 id="modalTitle">THE WORLD</h2><p id="modalText">Время остановлено.</p><button class="primary" id="modalClose">Продолжить</button></div></div>`;

const log=t=>{const d=document.createElement('div');d.textContent='› '+t;$('log').prepend(d);};
function speak(text){if(!voiceOn||!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.88;u.pitch=.82;u.volume=1;const vs=window.speechSynthesis.getVoices();u.voice=vs.find(v=>v.lang==='en-US')||vs[0]||null;window.speechSynthesis.speak(u);}
function beep(freq=560,dur=.13,type='sine'){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.06,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+dur);setTimeout(()=>c.close(),dur*1000+100)}catch{}}
function coachRender(){const t=trainers[trainer];$('coachBig').src=t.img;$('coachName').textContent=t.name;$('coachLine').textContent=t.line;$('youAvatar').src=t.img;$('youCoach').textContent='Тренер: '+t.name;document.querySelectorAll('.coach-card').forEach((el,i)=>el.classList.toggle('active',i===trainer));}
$('coachGrid').innerHTML=trainers.map((t,i)=>`<button class="coach-card ${i===trainer?'active':''}" data-trainer="${i}"><img src="${t.img}" alt="${t.name}"><span>${t.name.split(' ')[0]}</span></button>`).join('');
document.querySelectorAll('.coach-card').forEach(el=>el.addEventListener('click',()=>{trainer=Number(el.dataset.trainer);coachRender();speak(trainers[trainer].en);beep(640,.1)}));
function render(){const board=$('board');board.innerHTML='';const b=game.board();for(let r=0;r<8;r++)for(let c=0;c<8;c++){const sq=String.fromCharCode(97+c)+(8-r),p=b[r][c],btn=document.createElement('button');btn.className='sq '+((r+c)%2?'dark':'light');btn.dataset.sq=sq;btn.setAttribute('role','gridcell');if(lastMove&&(lastMove.from===sq||lastMove.to===sq))btn.classList.add('last');if(selected===sq)btn.classList.add('selected');if(legal.some(m=>m.to===sq))btn.classList.add(game.get(sq)?'capture':'legal');if(p){const id=p.color+sq;btn.innerHTML=`<span class="piece ${p.color==='w'?'white':'black'}">${glyph[p.color+p.type]}</span>`;if(awakened[id])btn.title=awakened[id].name;}btn.addEventListener('click',()=>tap(sq));board.append(btn)}$('games').textContent=(matchCount%10)+' / 10';$('arrows').textContent=arrows;updateStand();}
function updateStand(){const p=selected?game.get(selected):null,st=p?awakened[p.color+selected]:null;$('useArrow').disabled=!(arrows>0&&p&&p.color==='w'&&game.turn()==='w'&&!st&&!busy);$('activate').disabled=!(st&&p&&p.color==='w'&&!used[p.color+selected]&&!busy);$('standName').textContent=st?st.name:'СТЕНД НЕ ПРОБУЖДЁН';$('standDesc').textContent=st?st.desc:'Выбери свою фигуру, чтобы увидеть её стенд и способность.';}
function save(){history.push({fen:game.fen(),awakened:{...awakened},used:{...used},lastMove:lastMove?{...lastMove}:null});if(history.length>80)history.shift();}
function tap(sq){if(busy||gameEnded||game.turn()!=='w')return;const p=game.get(sq);if(selected&&legal.some(m=>m.to===sq)){move(selected,sq);return}if(p&&p.color==='w'){selected=sq;legal=game.moves({square:sq,verbose:true});render();return}selected=null;legal=[];render();}
function move(from,to){save();const moved=game.get(from),st=awakened['w'+from];const result=game.move({from,to,promotion:'q'});if(!result)return;if(st){awakened['w'+to]=st;delete awakened['w'+from];}lastMove={from,to};selected=null;legal=[];beep(st?760:500,.1);log(`Ты: ${from} → ${to}${st?' · '+st.name:''}`);if(game.isGameOver()){finish();render();return}render();if(extraMove){extraMove=false;game.load(game.fen().replace(' b ',' w '));$('status').textContent='King Crimson: дополнительный ход!';log('King Crimson: время для второго хода.');return;}scheduleBot();}
function evaluate(m){let score=0;const val={p:100,n:320,b:330,r:500,q:900,k:20000};if(m.captured)score+=val[m.captured]||0;if(m.promotion)score+=800;if(m.san.includes('+'))score+=45;if(m.san.includes('#'))score+=50000;return score;}
function botMove(){if(game.isGameOver()||game.turn()!=='b'){busy=false;return}const moves=game.moves({verbose:true});if(!moves.length){busy=false;finish();return}const diff=$('difficulty').value;let chosen;if(diff==='easy'){const caps=moves.filter(m=>m.captured);const pool=caps.length&&Math.random()<.5?caps:moves;chosen=pool[Math.floor(Math.random()*pool.length)]}else{const ranked=moves.map(m=>({m,s:evaluate(m)+(Math.random()* (diff==='medium'?80:25))})).sort((a,b)=>b.s-a.s);chosen=ranked[0].m}save();game.move({from:chosen.from,to:chosen.to,promotion:'q'});lastMove={from:chosen.from,to:chosen.to};busy=false;beep(370,.11,'triangle');log(`Бот: ${chosen.from} → ${chosen.to}`);if(game.isGameOver())finish();render();}
function scheduleBot(delay=650){busy=true;$('status').textContent=freezeNext?'The World: время остановлено на 7 секунд…':'Бот думает…';const wait=freezeNext?7000:(fastNext?120:delay);freezeNext=false;fastNext=false;setTimeout(botMove,wait);}
function finish(){if(gameEnded)return;gameEnded=true;matchCount++;let text=game.isCheckmate()?(game.turn()==='w'?'Мат. Победил бот.':'Мат! Ты победил.'):'Партия завершилась вничью.';$('status').textContent=text;log(text);if(matchCount%10===0){arrows++;log('Награда: получена новая стрела!');speak('Stand Arrow');}beep(850,.3,'triangle');render();}
function newGame(){game=new Chess();selected=null;legal=[];lastMove=null;history=[];awakened={};used={};busy=false;gameEnded=false;extraMove=false;freezeNext=false;fastNext=false;$('status').textContent='Твой ход. Выбери фигуру и клетку назначения.';$('log').innerHTML='';log('Новая партия началась.');render();}
$('newGame').onclick=newGame;$('undo').onclick=()=>{if(busy||!history.length)return;const h=history.pop();game.load(h.fen);awakened=h.awakened;used=h.used;lastMove=h.lastMove;selected=null;legal=[];gameEnded=false;$('status').textContent='Ход отменён.';log('Последний ход отменён.');render()};let flipped=false;$('flip').onclick=()=>{flipped=!flipped;$('board').style.transform=flipped?'rotate(180deg)':'';$('board').querySelectorAll('.piece').forEach(p=>p.style.transform=flipped?'rotate(180deg)':'');};
$('useArrow').onclick=()=>{if(!selected||!arrows)return;const p=game.get(selected);if(!p||p.color!=='w')return;arrows--;const roll=Math.random();if(roll<.22){$('status').textContent='Стрела не пробудила стенд. Попробуй снова в следующей партии.';log('Стрела использована, но пробуждение не произошло.');speak('Nothing happened');beep(180,.3,'sawtooth')}else{const st=stands[Math.floor(Math.random()*stands.length)];awakened['w'+selected]=st;$('status').textContent='Пробуждение: '+st.name+'!';log('Пробуждён стенд '+st.name+' у '+selected+'.');speak(st.say);beep(900,.2,'square');setTimeout(()=>beep(650,.24,'sawtooth'),170)}render()};
$('activate').onclick=()=>{if(!selected)return;const p=game.get(selected),key='w'+selected,st=awakened[key];if(!st||used[key])return;used[key]=true;speak(st.say);beep(720,.18,'square');switch(st.power){case'extra':extraMove=true;$('status').textContent='King Crimson активирован: после твоего хода будет ещё один.';break;case'freeze':freezeNext=true;$('status').textContent='The World! Следующий ход бота задержан на 7 секунд.';showModal('ZA WARUDO!','Время остановлено. Бот не сможет сделать ход в течение 7 секунд.');break;case'hint':{const ms=game.moves({square:selected,verbose:true});if(ms.length){const m=ms[Math.floor(Math.random()*ms.length)];$('status').textContent='Подсказка: попробуй '+m.from+' → '+m.to+'.';log('Подсказка стенда: '+m.from+' → '+m.to)}else $('status').textContent='У этой фигуры сейчас нет доступных ходов.';break}case'undo':{const h=history.pop();if(h){game.load(h.fen);awakened=h.awakened;used=h.used;lastMove=h.lastMove;$('status').textContent='Последний ход возвращён.';log(st.name+': последний ход отменён.')}else $('status').textContent='Пока нечего восстанавливать.';break}case'targets':{const targets=game.moves({verbose:true}).filter(m=>m.captured);$('status').textContent=targets.length?'Тактический обзор: доступно взятий — '+targets.length+'.':'Сейчас доступных взятий нет.';log('Тактический обзор завершён.');break}case'fast':fastNext=true;$('status').textContent='Made in Heaven: следующий ответ бота будет ускорен.';break}render()};
function showModal(title,text){$('modalTitle').textContent=title;$('modalText').textContent=text;$('modal').classList.add('show')}$('modalClose').onclick=()=>$('modal').classList.remove('show');$('voiceTest').onclick=()=>{const p=selected?game.get(selected):null,st=p?awakened['w'+selected]:null;speak(st?st.say:'Stand Chess');if(!('speechSynthesis'in window))$('status').textContent='На устройстве не найден системный синтез речи.'};$('soundToggle').onclick=()=>{voiceOn=!voiceOn;$('soundToggle').textContent=voiceOn?'🔊 Звук':'🔇 Без звука';if(!voiceOn&&'speechSynthesis'in window)window.speechSynthesis.cancel()};
render();coachRender();</script></body></html>
